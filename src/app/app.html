<div class="contenedor">

  <h1>📋 Mi Lista de Tareas</h1>

  <p class="subtitulo">
    Organiza tus actividades de una manera sencilla
  </p>

  <div class="agregar">

    <input
      type="text"
      [(ngModel)]="nuevaTarea"
      placeholder="Escribe una nueva tarea">

    <button (click)="agregarTarea()">
      Agregar
    </button>

  </div>

  <div
    class="tarea"
    *ngFor="let tarea of tareas; let i = index">

    <span
      [class.realizada]="tarea.realizada"
      (click)="tarea.realizada = !tarea.realizada">

      {{ tarea.nombre }}

    </span>

    <button
      class="eliminar"
      (click)="eliminarTarea(i)">

      Eliminar

    </button>

  </div>

  <p *ngIf="tareas.length === 0" class="vacio">
    No tienes tareas pendientes 🎉
  </p>

</div>
